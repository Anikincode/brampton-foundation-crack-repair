# GitHub Pages builds this site with Jekyll. The pages are plain HTML with no
# front matter, so Jekyll copies them as-is; it's only here to build sitemap.xml.
url: https://bramptonfoundationcrackrepair.ca
plugins:
  - jekyll-sitemap
exclude:
  - README.md
defaults:
  - scope:
      path: contact/thanks
    values:
      sitemap: false
